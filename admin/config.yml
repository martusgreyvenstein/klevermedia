backend:
  name: git-gateway
  branch: main

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: "work"
    label: "Work Posts"
    files:
      - label: "Work Posts"
        name: "posts"
        file: "content/posts.json"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}} — {{fields.client}}"
            fields:

              # ── Content ──────────────────────────────────────
              - { label: "Title",     name: "title",    widget: "string" }
              - { label: "Client",    name: "client",   widget: "string" }
              - { label: "Slug",      name: "slug",     widget: "string", hint: "URL-friendly, no spaces (e.g. my-new-project)" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "SEO / GEO"
                  - "Content Marketing"
                  - "Strategy"
                  - "SEO / Content Marketing"
              - { label: "Excerpt",   name: "excerpt",  widget: "text", hint: "Shown on the work grid card — 1-2 sentences." }
              - { label: "Date",      name: "date",     widget: "string", hint: "Format: YYYY-MM-DD (e.g. 2026-04-10)" }
              - { label: "Tags",      name: "tags",     widget: "list" }
              - { label: "Thumbnail", name: "thumb",    widget: "image",  required: false }
              - { label: "Post File", name: "postFile", widget: "string", required: false, hint: "Filename in /work/ folder (e.g. my-new-project.html)" }

              # ── SEO ──────────────────────────────────────────
              - label: "SEO"
                name: "seo"
                widget: "object"
                collapsed: false
                hint: "Controls how this post appears in Google and AI search results."
                fields:
                  - label: "Focus Keyphrase"
                    name: "keyphrase"
                    widget: "string"
                    required: false
                    hint: "The main keyword this post should rank for (e.g. 'SEO strategy for B2B brands'). Use it in the title, meta description, and H1."
                  - label: "SEO Title"
                    name: "metaTitle"
                    widget: "string"
                    required: false
                    hint: "Shown in Google search results. Ideal length: 50–60 characters. Leave blank to use the post title."
                  - label: "Meta Description"
                    name: "metaDescription"
                    widget: "text"
                    required: false
                    hint: "Shown under the title in search results. Ideal length: 150–160 characters. Include your focus keyphrase."
                  - label: "OG / Social Image"
                    name: "ogImage"
                    widget: "image"
                    required: false
                    hint: "Image shown when this post is shared on social media. Recommended: 1200×630px."
